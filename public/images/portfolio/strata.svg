<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15122B" />
      <stop offset="100%" stop-color="#0E0D1A" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cloudGrad)" />
  <rect x="50" y="50" width="700" height="400" rx="14" fill="#1C1836" stroke="#7C4DFF" stroke-width="1.5" stroke-opacity="0.3" />
  
  <text x="80" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">STRATA // CLUSTER ORCHESTRATION</text>
  <rect x="570" y="75" width="150" height="30" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <text x="590" y="95" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">● REGIONS HEALTHY</text>

  <!-- Node diagram -->
  <circle cx="200" cy="240" r="45" fill="#252047" stroke="#7C4DFF" stroke-width="2" />
  <text x="175" y="245" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">US-WEST</text>
  
  <circle cx="400" cy="180" r="55" fill="#252047" stroke="#14B8A6" stroke-width="2.5" />
  <text x="365" y="185" fill="#14B8A6" font-family="sans-serif" font-size="14" font-weight="bold">GATEWAY</text>

  <circle cx="600" cy="240" r="45" fill="#252047" stroke="#7C4DFF" stroke-width="2" />
  <text x="575" y="245" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">EU-CENTRAL</text>

  <circle cx="400" cy="340" r="45" fill="#252047" stroke="#B996FF" stroke-width="2" />
  <text x="375" y="345" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">AP-SOUTH</text>

  <!-- Connecting lines -->
  <line x1="245" y1="230" x2="345" y2="195" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="6" />
  <line x1="455" y1="195" x2="555" y2="230" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="6" />
  <line x1="400" y1="235" x2="400" y2="295" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6" />

  <!-- Stats footer -->
  <rect x="80" y="390" width="640" height="40" rx="8" fill="#131124" />
  <text x="100" y="415" fill="#9CA3AF" font-family="sans-serif" font-size="12">Containers: 1,482 Active  |  Traffic: 4.8 GB/s  |  Failovers: 0 in 90 days</text>
