<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#0B0A12" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#642CD7" />
      <stop offset="50%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#642CD7" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#17152B" stroke="#7C4DFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Header bar -->
  <rect x="40" y="40" width="720" height="50" rx="16" fill="#1F1B38" />
  <circle cx="70" cy="65" r="6" fill="#EF4444" />
  <circle cx="92" cy="65" r="6" fill="#F59E0B" />
  <circle cx="114" cy="65" r="6" fill="#10B981" />
  <text x="140" y="70" fill="#9CA3AF" font-family="sans-serif" font-size="13">nexus.analytics.internal/dashboard</text>
  
  <!-- Metric Cards -->
  <rect x="70" y="115" width="200" height="85" rx="10" fill="#121020" stroke="#B996FF" stroke-opacity="0.2" />
  <text x="90" y="145" fill="#9CA3AF" font-family="sans-serif" font-size="12">EVENTS PROCESSED</text>
  <text x="90" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="bold">42.8M / sec</text>
  
  <rect x="300" y="115" width="200" height="85" rx="10" fill="#121020" stroke="#14B8A6" stroke-opacity="0.3" />
  <text x="320" y="145" fill="#9CA3AF" font-family="sans-serif" font-size="12">LATENCY</text>
  <text x="320" y="180" fill="#14B8A6" font-family="sans-serif" font-size="24" font-weight="bold">18ms (avg)</text>

  <rect x="530" y="115" width="200" height="85" rx="10" fill="#121020" stroke="#B996FF" stroke-opacity="0.2" />
  <text x="550" y="145" fill="#9CA3AF" font-family="sans-serif" font-size="12">SYSTEM HEALTH</text>
  <text x="550" y="180" fill="#B996FF" font-family="sans-serif" font-size="24" font-weight="bold">99.99% UP</text>

  <!-- Big Chart -->
  <rect x="70" y="225" width="660" height="205" rx="10" fill="#121020" stroke="#7C4DFF" stroke-opacity="0.2" />
  <!-- Grid lines -->
  <line x1="100" y1="270" x2="700" y2="270" stroke="#252140" stroke-width="1" stroke-dasharray="4" />
  <line x1="100" y1="320" x2="700" y2="320" stroke="#252140" stroke-width="1" stroke-dasharray="4" />
  <line x1="100" y1="370" x2="700" y2="370" stroke="#252140" stroke-width="1" stroke-dasharray="4" />
  <!-- Wave Graph -->
  <path d="M 100 380 Q 200 260 300 330 T 500 280 T 700 250" fill="none" stroke="url(#lineGrad)" stroke-width="4" />
  <!-- Glow under chart -->
  <path d="M 100 380 Q 200 260 300 330 T 500 280 T 700 250 L 700 410 L 100 410 Z" fill="url(#barGrad)" fill-opacity="0.12" />
</svg>
