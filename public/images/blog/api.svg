<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#131024" />
  <rect x="50" y="40" width="500" height="270" rx="12" fill="#1B1733" stroke="#7C4DFF" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Endpoint cards -->
  <rect x="90" y="80" width="420" height="45" rx="8" fill="#110E21" stroke="#10B981" stroke-width="1" />
  <rect x="105" y="90" width="60" height="25" rx="4" fill="#10B981" />
  <text x="120" y="107" fill="#0B0A12" font-family="monospace" font-size="12" font-weight="bold">GET</text>
  <text x="180" y="108" fill="#FFFFFF" font-family="monospace" font-size="13">/v1/api/telemetry/stream</text>
  <text x="430" y="108" fill="#10B981" font-family="monospace" font-size="12">200 OK</text>

  <rect x="90" y="140" width="420" height="45" rx="8" fill="#110E21" stroke="#7C4DFF" stroke-width="1" />
  <rect x="105" y="150" width="60" height="25" rx="4" fill="#7C4DFF" />
  <text x="115" y="167" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">POST</text>
  <text x="180" y="168" fill="#FFFFFF" font-family="monospace" font-size="13">/v1/api/checkout/session</text>
  <text x="410" y="168" fill="#B996FF" font-family="monospace" font-size="12">201 CREATED</text>

  <rect x="90" y="200" width="420" height="45" rx="8" fill="#110E21" stroke="#F59E0B" stroke-width="1" />
  <rect x="105" y="210" width="60" height="25" rx="4" fill="#F59E0B" />
  <text x="120" y="227" fill="#0B0A12" font-family="monospace" font-size="12" font-weight="bold">PUT</text>
  <text x="180" y="228" fill="#FFFFFF" font-family="monospace" font-size="13">/v1/api/cluster/nodes/:id</text>
  <text x="425" y="228" fill="#F59E0B" font-family="monospace" font-size="12">200 RES</text>
</svg>
