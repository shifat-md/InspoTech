<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#120F24" />
  <circle cx="300" cy="175" r="140" fill="#642CD7" fill-opacity="0.15" filter="blur(40px)" />
  <rect x="50" y="40" width="500" height="270" rx="12" fill="#191533" stroke="#7C4DFF" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Architectural diagram -->
  <rect x="90" y="80" width="120" height="70" rx="8" fill="#251F4A" stroke="#B996FF" stroke-width="1.5" />
  <text x="110" y="120" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Frontend (UI)</text>
  
  <rect x="390" y="80" width="120" height="70" rx="8" fill="#251F4A" stroke="#14B8A6" stroke-width="1.5" />
  <text x="405" y="120" fill="#14B8A6" font-family="sans-serif" font-size="14" font-weight="bold">Backend (API)</text>

  <rect x="240" y="200" width="120" height="70" rx="8" fill="#251F4A" stroke="#7C4DFF" stroke-width="1.5" />
  <text x="260" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Database</text>

  <!-- Connectors -->
  <line x1="210" y1="115" x2="390" y2="115" stroke="#B996FF" stroke-width="2" stroke-dasharray="4" />
  <line x1="150" y1="150" x2="240" y2="225" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="4" />
  <line x1="450" y1="150" x2="360" y2="225" stroke="#14B8A6" stroke-width="2" stroke-dasharray="4" />
</svg>
