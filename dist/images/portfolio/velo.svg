<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0C111C" />
  <rect x="50" y="50" width="700" height="400" rx="14" fill="#131C2D" stroke="#7C4DFF" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="80" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">VELO // FLEET DISPATCH COMMAND</text>
  
  <!-- Map grid mockup -->
  <rect x="80" y="130" width="420" height="230" rx="10" fill="#0A0F1A" stroke="#253247" />
  <!-- Simulated roads -->
  <line x1="80" y1="200" x2="500" y2="240" stroke="#1F2E45" stroke-width="6" />
  <line x1="250" y1="130" x2="320" y2="360" stroke="#1F2E45" stroke-width="8" />
  <line x1="150" y1="360" x2="480" y2="160" stroke="#1F2E45" stroke-width="4" />
  
  <!-- Moving vehicle markers -->
  <circle cx="280" cy="210" r="12" fill="#14B8A6" />
  <circle cx="280" cy="210" r="22" fill="#14B8A6" fill-opacity="0.3" />
  <text x="274" y="215" fill="#0B0A12" font-family="sans-serif" font-size="12" font-weight="bold">V1</text>

  <circle cx="410" cy="200" r="12" fill="#7C4DFF" />
  <circle cx="410" cy="200" r="22" fill="#7C4DFF" fill-opacity="0.3" />
  <text x="404" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">V2</text>

  <!-- Right stats panel -->
  <rect x="520" y="130" width="200" height="230" rx="10" fill="#0A0F1A" stroke="#253247" />
  <text x="540" y="160" fill="#9CA3AF" font-family="sans-serif" font-size="12">ACTIVE FLEET</text>
  <text x="540" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold">2,148</text>
  <text x="540" y="220" fill="#14B8A6" font-family="sans-serif" font-size="12">▲ 98.4% on schedule</text>
  
  <rect x="540" y="245" width="160" height="40" rx="6" fill="#172233" />
  <text x="550" y="270" fill="#9CA3AF" font-family="sans-serif" font-size="11">Avg Fuel Saved: 24%</text>

  <rect x="540" y="295" width="160" height="40" rx="6" fill="#172233" />
  <text x="550" y="320" fill="#9CA3AF" font-family="sans-serif" font-size="11">Route Sync: Live (3s)</text>

  <rect x="80" y="380" width="640" height="50" rx="8" fill="#0A0F1A" />
  <text x="100" y="410" fill="#9CA3AF" font-family="sans-serif" font-size="12">Leaflet Geofencing  |  Offline Queue Sync  |  High-Concurrency GPS Telemetry</text>
</svg>
